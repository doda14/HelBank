<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelCasino</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d2d;
      --accent: #ff0055;
      --accent-hover: #cc0044;
      --text: #ffffff;
      --text-muted: #8e94a8;
      --green: #00e676;
      --red: #ff1744;
      --gold: #ffb300;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--card-bg); border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2e45; }
    .logo { font-size: 24px; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
    .balance-box { font-size: 18px; font-weight: 600; background: #10121d; padding: 8px 16px; border-radius: 8px; border: 1px solid #2e334d; }
    .balance-val { color: var(--gold); }

    nav { display: flex; gap: 10px; width: 100%; max-width: 900px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .nav-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid #2a2e45; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; white-space: nowrap; }
    .nav-btn.active, .nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .game-card { width: 100%; max-width: 900px; background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid #2a2e45; display: none; flex-direction: column; align-items: center; gap: 20px; }
    .game-card.active { display: flex; }

    input, select, button { outline: none; border: none; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%; margin-top: 15px; }
    .btn-action { background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
    .btn-action:hover { background: var(--accent-hover); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
    select, input[type="number"] { background: #10121d; color: #fff; border: 1px solid #2e334d; padding: 10px 15px; border-radius: 8px; font-size: 16px; }

    /* Crash */
    .crash-display { font-size: 48px; font-weight: 800; color: var(--accent); height: 120px; display: flex; align-items: center; justify-content: center; }

    /* Slots 3x3 */
    .slots-grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; background: #10121d; padding: 15px; border-radius: 12px; border: 2px solid #2e334d; }
    .slot-cell { width: 80px; height: 80px; background: #1a1d2d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 1px solid #2e334d; }

    /* Dice */
    .dice-container { display: flex; gap: 20px; margin: 10px 0; }
    .dice-img { width: 90px; height: 90px; border-radius: 10px; border: 2px solid #2e334d; background: #fff; object-fit: cover; }

    /* Roulette */
    .roulette-wrapper { width: 100%; overflow: hidden; background: #10121d; border-radius: 8px; border: 2px solid #2e334d; position: relative; height: 80px; }
    .roulette-track { display: flex; height: 100%; transition: transform 4s cubic-bezier(0.1, 1, 0.1, 1); position: absolute; left: 50%; }
    .roulette-item { width: 60px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; flex-shrink: 0; color: #fff; border-right: 1px solid #1a1d2d; }
    .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: var(--gold); z-index: 10; }

    .result-msg { font-size: 18px; font-weight: bold; min-height: 27px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="logo">HelCasino</div>
    <div class="balance-box">Баланс: <span id="balance" class="balance-val">1000000</span> $</div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchGame('crash')">Краш</button>
    <button class="nav-btn" onclick="switchGame('slots')">Слоты 3x3</button>
    <button class="nav-btn" onclick="switchGame('coin')">Орел и Решка</button>
    <button class="nav-btn" onclick="switchGame('dice')">Дайс (Кости)</button>
    <button class="nav-btn" onclick="switchGame('wheel')">Колесо Фортуны</button>
    <button class="nav-btn" onclick="switchGame('roulette')">Рулетка</button>
  </nav>

  <!-- КРАШ -->
  <div id="game-crash" class="game-card active">
    <h2>Краш</h2>
    <div id="crash-num" class="crash-display">1.00x</div>
    <div class="controls">
      <input type="number" id="crash-bet" value="1000" min="100" placeholder="Ставка">
      <button id="crash-start-btn" class="btn-action" onclick="startCrash()">Старт</button>
      <button id="crash-cashout-btn" class="btn-action" style="background: var(--green);" onclick="cashoutCrash()" disabled>Забрать</button>
    </div>
    <div id="crash-res" class="result-msg"></div>
  </div>

  <!-- СЛОТЫ 3x3 -->
  <div id="game-slots" class="game-card">
    <h2>Слоты 3x3</h2>
    <div class="slots-grid">
      <div class="slot-cell" id="s0">💎</div><div class="slot-cell" id="s1">💎</div><div class="slot-cell" id="s2">💎</div>
      <div class="slot-cell" id="s3">💎</div><div class="slot-cell" id="s4">💎</div><div class="slot-cell" id="s5">💎</div>
      <div class="slot-cell" id="s6">💎</div><div class="slot-cell" id="s7">💎</div><div class="slot-cell" id="s8">💎</div>
    </div>
    <div class="controls">
      <label>Ставка:</label>
      <select id="slots-bet">
        <option value="1000">1,000</option>
        <option value="10000">10,000</option>
        <option value="100000">100,000</option>
        <option value="1000000">1,000,000</option>
        <option value="10000000">10,000,000</option>
      </select>
      <button class="btn-action" onclick="spinSlots()">Крутить</button>
    </div>
    <div id="slots-res" class="result-msg"></div>
  </div>

  <!-- ОРЕЛ И РЕШКА -->
  <div id="game-coin" class="game-card">
    <h2>Орел и Решка</h2>
    <div class="controls">
      <input type="number" id="coin-bet" value="1000" placeholder="Ставка">
      <select id="coin-choice">
        <option value="heads">Орел</option>
        <option value="tails">Решка</option>
      </select>
      <button class="btn-action" onclick="playCoin()">Бросить</button>
    </div>
    <div id="coin-res" class="result-msg"></div>
  </div>

  <!-- ДАЙС -->
  <div id="game-dice" class="game-card">
    <h2>Дайс (2 Кости)</h2>
    <div class="dice-container">
      <img id="dice1-img" class="dice-img" src="photo_2026-09-05_17-29-51.jpg" alt="1">
      <img id="dice2-img" class="dice-img" src="photo_2026-09-05_17-29-51.jpg" alt="1">
    </div>
    <div class="controls">
      <input type="number" id="dice-bet" value="1000" placeholder="Ставка">
      <select id="dice-choice">
        <option value="under">Меньше 6</option>
        <option value="over">Больше 6</option>
      </select>
      <button class="btn-action" onclick="playDice()">Бросить кости</button>
    </div>
    <div id="dice-res" class="result-msg"></div>
  </div>

  <!-- КОЛЕСО ФОРТУНЫ -->
  <div id="game-wheel" class="game-card">
    <h2>Колесо Фортуны (Case Battle)</h2>
    <div class="controls">
      <input type="number" id="wheel-bet" value="1000" placeholder="Ставка">
      <select id="wheel-mode">
        <option value="x2">x2 (Шанс 50%)</option>
        <option value="x3">x3 (Шанс 30%)</option>
        <option value="x10">x10 (Шанс 10%)</option>
      </select>
      <button class="btn-action" onclick="spinWheel()">Крутить</button>
    </div>
    <div id="wheel-res" class="result-msg"></div>
  </div>

  <!-- РУЛЕТКА -->
  <div id="game-roulette" class="game-card">
    <h2>Рулетка</h2>
    <div class="roulette-wrapper">
      <div class="roulette-pointer"></div>
      <div id="roulette-track" class="roulette-track"></div>
    </div>
    <div class="controls">
      <input type="number" id="roulette-bet" value="1000" placeholder="Ставка">
      <select id="roulette-choice">
        <option value="red">Красное (x2)</option>
        <option value="black">Черное (x2)</option>
        <option value="green">Зеленое / 0 (x14)</option>
      </select>
      <button class="btn-action" onclick="spinRoulette()">Вращать</button>
    </div>
    <div id="roulette-res" class="result-msg"></div>
  </div>

  <script>
    // --- ОБЩИЙ БАЛАНС ---
    let balance = parseInt(localStorage.getItem('casino_balance')) || 1000000;
    function updateBalanceUI() {
      document.getElementById('balance').innerText = balance.toLocaleString();
      localStorage.setItem('casino_balance', balance);
    }
    updateBalanceUI();

    function switchGame(gameId) {
      document.querySelectorAll('.game-card').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`game-${gameId}`).classList.add('active');
      event.target.classList.add('active');
    }

    // --- 1. КРАШ (БЕЗ АВТОВЫВОДА) ---
    let crashTimer = null;
    let crashMultiplier = 1.00;
    let crashTarget = 1.00;
    let crashBetVal = 0;
    let crashActive = false;

    function startCrash() {
      const betInput = document.getElementById('crash-bet');
      crashBetVal = parseInt(betInput.value);
      if (isNaN(crashBetVal) || crashBetVal <= 0 || crashBetVal > balance) {
        alert('Некорректная ставка!');
        return;
      }

      balance -= crashBetVal;
      updateBalanceUI();

      // Настройка скрученных шансов
      const rand = Math.random();
      if (rand < 0.05) {
        crashTarget = +(3.01 + Math.random() * 4.99).toFixed(2); // 5% (1 из 20) -> > x3
      } else if (rand < 0.15) {
        crashTarget = +(1.80 + Math.random() * 0.50).toFixed(2); // 10% (1 из 10) -> ~ x2
      } else {
        crashTarget = +(1.00 + Math.random() * 0.20).toFixed(2); // 85% -> 1.00x - 1.20x
      }

      crashMultiplier = 1.00;
      crashActive = true;
      document.getElementById('crash-res').innerText = '';
      document.getElementById('crash-res').style.color = '#fff';
      document.getElementById('crash-start-btn').disabled = true;
      document.getElementById('crash-cashout-btn').disabled = false;

      crashTimer = setInterval(() => {
        crashMultiplier += 0.02;
        document.getElementById('crash-num').innerText = crashMultiplier.toFixed(2) + 'x';

        if (crashMultiplier >= crashTarget) {
          clearInterval(crashTimer);
          crashActive = false;
          document.getElementById('crash-num').innerText = crashTarget.toFixed(2) + 'x (CRASH)';
          document.getElementById('crash-res').innerText = `Сгорение на ${crashTarget.toFixed(2)}x! Вы проиграли ${crashBetVal}$.`;
          document.getElementById('crash-res').style.color = 'var(--red)';
          document.getElementById('crash-start-btn').disabled = false;
          document.getElementById('crash-cashout-btn').disabled = true;
        }
      }, 60);
    }

    function cashoutCrash() {
      if (!crashActive) return;
      clearInterval(crashTimer);
      crashActive = false;

      const winAmount = Math.floor(crashBetVal * crashMultiplier);
      balance += winAmount;
      updateBalanceUI();

      document.getElementById('crash-res').innerText = `Забрано на ${crashMultiplier.toFixed(2)}x! Выигрыш: ${winAmount}$.`;
      document.getElementById('crash-res').style.color = 'var(--green)';
      document.getElementById('crash-start-btn').disabled = false;
      document.getElementById('crash-cashout-btn').disabled = true;
    }

    // --- 2. СЛОТЫ 3x3 ---
    const slotIcons = ['🍋', '🍒', '🔔', '💎', '7️⃣'];
    function spinSlots() {
      const bet = parseInt(document.getElementById('slots-bet').value);
      if (bet > balance) { alert('Недостаточно средств!'); return; }

      balance -= bet;
      updateBalanceUI();

      const grid = [];
      for (let i = 0; i < 9; i++) {
        const randIcon = slotIcons[Math.floor(Math.random() * slotIcons.length)];
        grid.push(randIcon);
        document.getElementById(`s${i}`).innerText = randIcon;
      }

      // Проверка совпадения любой из линий
      let win = false;
      const lines = [
        [0,1,2], [3,4,5], [6,7,8], // горизонтали
        [0,3,6], [1,4,7], [2,5,8], // вертикали
        [0,4,8], [2,4,6]          // диагонали
      ];

      for (let line of lines) {
        if (grid[line[0]] === grid[line[1]] && grid[line[1]] === grid[line[2]]) {
          win = true;
          break;
        }
      }

      const resEl = document.getElementById('slots-res');
      if (win) {
        const winVal = bet * 5;
        balance += winVal;
        resEl.innerText = `Победа! Выигрыш: ${winVal}$`;
        resEl.style.color = 'var(--green)';
      } else {
        resEl.innerText = `Не повезло. Проигрыш: ${bet}$`;
        resEl.style.color = 'var(--red)';
      }
      updateBalanceUI();
    }

    // --- 3. ОРЕЛ И РЕШКА (30% ШАНС) ---
    function playCoin() {
      const bet = parseInt(document.getElementById('coin-bet').value);
      const choice = document.getElementById('coin-choice').value;
      if (isNaN(bet) || bet <= 0 || bet > balance) { alert('Некорректная ставка!'); return; }

      balance -= bet;

      const isWin = Math.random() < 0.30; // 30% винрейт казино
      const resultSide = isWin ? choice : (choice === 'heads' ? 'tails' : 'heads');
      const sideText = resultSide === 'heads' ? 'Орел' : 'Решка';

      const resEl = document.getElementById('coin-res');
      if (isWin) {
        const winVal = bet * 2;
        balance += winVal;
        resEl.innerText = `Выпал ${sideText}! Вы выиграли ${winVal}$`;
        resEl.style.color = 'var(--green)';
      } else {
        resEl.innerText = `Выпал ${sideText}! Вы проиграли ${bet}$`;
        resEl.style.color = 'var(--red)';
      }
      updateBalanceUI();
    }

    // --- 4. ДАЙС (2 КОСТИ, ТЕКСТУРЫ И 30% ВИНРЕЙТ) ---
    const DICE_IMAGES = {
      1: 'photo_2026-09-05_17-29-51.jpg',
      2: 'photo_2026-09-05_17-29-59.jpg',
      3: 'photo_2026-09-05_17-30-02.jpg',
      4: 'photo_2026-09-05_17-30-08.jpg',
      5: 'photo_2026-09-05_17-30-09.jpg',
      6: 'photo_2026-09-05_17-30-11.jpg'
    };

    function playDice() {
      const bet = parseInt(document.getElementById('dice-bet').value);
      const choice = document.getElementById('dice-choice').value;
      if (isNaN(bet) || bet <= 0 || bet > balance) { alert('Некорректная ставка!'); return; }

      balance -= bet;

      const isWin = Math.random() < 0.30; // Фиксированный 30% шанс победы
      let d1, d2, sum;

      do {
        d1 = Math.floor(Math.random() * 6) + 1;
        d2 = Math.floor(Math.random() * 6) + 1;
        sum = d1 + d2;
        const conditionMet = (choice === 'under' && sum < 6) || (choice === 'over' && sum > 6);
        if (conditionMet === isWin) break;
      } while (true);

      document.getElementById('dice1-img').src = DICE_IMAGES[d1];
      document.getElementById('dice2-img').src = DICE_IMAGES[d2];

      const resEl = document.getElementById('dice-res');
      if (isWin) {
        const winVal = bet * 2;
        balance += winVal;
        resEl.innerText = `Сумма: ${sum}. Победа! Выигрыш: ${winVal}$`;
        resEl.style.color = 'var(--green)';
      } else {
        resEl.innerText = `Сумма: ${sum}. Проигрыш: ${bet}$`;
        resEl.style.color = 'var(--red)';
      }
      updateBalanceUI();
    }

    // --- 5. КОЛЕСО ФОРТУНЫ (CASE BATTLE ШАНСЫ) ---
    const wheelModes = {
      'x2': { mult: 2, chance: 0.50 },
      'x3': { mult: 3, chance: 0.30 },
      'x10': { mult: 10, chance: 0.10 }
    };

    function spinWheel() {
      const bet = parseInt(document.getElementById('wheel-bet').value);
      const modeKey = document.getElementById('wheel-mode').value;
      if (isNaN(bet) || bet <= 0 || bet > balance) { alert('Некорректная ставка!'); return; }

      balance -= bet;
      const mode = wheelModes[modeKey];
      const isWin = Math.random() < mode.chance;

      const resEl = document.getElementById('wheel-res');
      if (isWin) {
        const winVal = bet * mode.mult;
        balance += winVal;
        resEl.innerText = `Успех (${modeKey})! Выигрыш: ${winVal}$`;
        resEl.style.color = 'var(--green)';
      } else {
        resEl.innerText = `Невыпадение (${modeKey}). Проигрыш: ${bet}$`;
        resEl.style.color = 'var(--red)';
      }
      updateBalanceUI();
    }

    // --- 6. РУЛЕТКА (ПРОКРУТ ЦИФР И ЦВЕТА) ---
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    const rouletteTrack = document.getElementById('roulette-track');

    function buildRouletteTrack() {
      rouletteTrack.innerHTML = '';
      for (let i = 0; i < 80; i++) {
        const num = Math.floor(Math.random() * 37);
        const item = document.createElement('div');
        item.className = 'roulette-item';
        item.innerText = num;
        
        if (num === 0) {
          item.style.background = '#008000';
        } else if (redNumbers.includes(num)) {
          item.style.background = '#ff1744';
        } else {
          item.style.background = '#2b2b2b';
        }
        rouletteTrack.appendChild(item);
      }
    }
    buildRouletteTrack();

    function spinRoulette() {
      const bet = parseInt(document.getElementById('roulette-bet').value);
      const choice = document.getElementById('roulette-choice').value;
      if (isNaN(bet) || bet <= 0 || bet > balance) { alert('Некорректная ставка!'); return; }

      balance -= bet;
      updateBalanceUI();

      buildRouletteTrack();
      rouletteTrack.style.transition = 'none';
      rouletteTrack.style.transform = 'translateX(0px)';

      setTimeout(() => {
        const winningNum = Math.floor(Math.random() * 37);
        let winningColor = winningNum === 0 ? 'green' : (redNumbers.includes(winningNum) ? 'red' : 'black');
        
        // Визуальная подстановка выигрышного элемента на позицию остановки
        const targetIndex = 60;
        const targetItem = rouletteTrack.children[targetIndex];
        targetItem.innerText = winningNum;
        targetItem.style.background = winningColor === 'green' ? '#008000' : (winningColor === 'red' ? '#ff1744' : '#2b2b2b');

        const itemWidth = 60;
        const offset = -(targetIndex * itemWidth - (document.querySelector('.roulette-wrapper').offsetWidth / 2) + itemWidth / 2);
        
        rouletteTrack.style.transition = 'transform 3.5s cubic-bezier(0.1, 1, 0.1, 1)';
        rouletteTrack.style.transform = `translateX(${offset}px)`;

        setTimeout(() => {
          const resEl = document.getElementById('roulette-res');
          let win = false;
          let winVal = 0;

          if (choice === winningColor) {
            win = true;
            winVal = choice === 'green' ? bet * 14 : bet * 2;
          }

          if (win) {
            balance += winVal;
            resEl.innerText = `Выпало: ${winningNum} (${winningColor}). Выигрыш: ${winVal}$`;
            resEl.style.color = 'var(--green)';
          } else {
            resEl.innerText = `Выпало: ${winningNum} (${winningColor}). Проигрыш: ${bet}$`;
            resEl.style.color = 'var(--red)';
          }
          updateBalanceUI();
        }, 3600);
      }, 50);
    }
  </script>
</body>
</html>
